# fly.toml app configuration file generated for erp-schools-api on 2026-08-16T01:46:11+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'erp-schools-api'
primary_region = 'fra'

[build]
  dockerfile = 'packages/api/Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '8080'
  SCHOOL_TZ = 'Africa/Khartoum'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpus = 1
  memory_mb = 256
